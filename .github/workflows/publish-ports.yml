name: Publish Linux and Android port builds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish v1.0.1 port artifacts
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.3.11579264
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build packages
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" >/dev/null

      - name: Build all Android native engines
        run: |
          chmod +x android/scripts/build-engine.sh
          cd android
          ./scripts/build-engine.sh

      - name: Build Android debug APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Build Debian package
        run: |
          chmod +x packaging/debian/build-deb.sh
          packaging/debian/build-deb.sh amd64

      - name: Prepare release assets
        run: |
          mkdir release-assets
          cp dist/xhr-client_1.0.1_amd64.deb release-assets/XHR-1.0.1-linux-amd64.deb
          (cd release-assets && sha256sum XHR-1.0.1-linux-amd64.deb > XHR-1.0.1-linux-amd64.deb.sha256)
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-assets/XHR-1.0.1-arm64-v8a-debug.apk
          cp android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk release-assets/XHR-1.0.1-armeabi-v7a-debug.apk
          cp android/app/build/outputs/apk/debug/app-x86-debug.apk release-assets/XHR-1.0.1-x86-debug.apk
          cp android/app/build/outputs/apk/debug/app-x86_64-debug.apk release-assets/XHR-1.0.1-x86_64-debug.apk
          cp android/app/build/outputs/apk/debug/app-universal-debug.apk release-assets/XHR-1.0.1-universal-debug.apk
          (
            cd release-assets
            sha256sum XHR-1.0.1-linux-amd64.deb XHR-1.0.1-*-debug.apk > SHA256SUMS-ports.txt
          )

      - name: Upload assets to v1.0.1
        run: |
          gh release upload v1.0.1 \
            release-assets/XHR-1.0.1-linux-amd64.deb#"Linux amd64 Debian package" \
            release-assets/XHR-1.0.1-linux-amd64.deb.sha256#"Linux amd64 Debian package checksum" \
            release-assets/XHR-1.0.1-arm64-v8a-debug.apk#"Android arm64-v8a debug APK" \
            release-assets/XHR-1.0.1-armeabi-v7a-debug.apk#"Android armeabi-v7a debug APK" \
            release-assets/XHR-1.0.1-x86-debug.apk#"Android x86 debug APK" \
            release-assets/XHR-1.0.1-x86_64-debug.apk#"Android x86_64 debug APK" \
            release-assets/XHR-1.0.1-universal-debug.apk#"Android universal debug APK" \
            release-assets/SHA256SUMS-ports.txt#"Checksums for Linux and debug Android builds" \
            --repo "$GITHUB_REPOSITORY" --clobber
