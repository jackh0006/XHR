name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -race ./...

      - name: Build
        run: go build ./...

  worker:
    name: Cloudflare Worker tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax
        run: |
          cd cloudflare
          node --check worker.js
          node --check frames.js

      - name: Frame tests
        run: cd cloudflare && node --test frames.test.mjs

  gas:
    name: Apps Script syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse Code.gs
        run: |
          cp gas/Code.gs /tmp/Code.js
          node --check /tmp/Code.js

      - name: Relay logic tests
        run: node --test gas/gas.test.mjs
