name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -race ./...

      - name: Build
        run: go build ./...

  worker:
    name: Cloudflare Worker tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax
        run: |
          cd cloudflare
          node --check worker.js
          node --check frames.js

      - name: Frame tests
        run: cd cloudflare && node --test frames.test.mjs

  gas:
    name: Apps Script syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse Code.gs
        run: |
          cp gas/Code.gs /tmp/Code.js
          node --check /tmp/Code.js

      - name: Relay logic tests
        run: node --test gas/gas.test.mjs

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xhr-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
